							{id:4375,title:"Tsuihou sareta Tensei Juukishi wa Game Chishiki de Musou suru",synopsis:"\"¡Hijo inútil! Se suponía que debías convertirte en un maestro espadachín, ¡pero nunca pensé que sería tan trágico!\"\n\nEl día que un niño cumple quince años, se somete al Ritual de la Bendición Divina. Ya descendiente de una línea de maestros espadachines, Elymas debía suceder a su padre. Sin embargo, le toca la clase defectuosa, el Caballero Pesado, y no solo pierde su estatus como futuro jefe del hogar, sino que también es exiliado. Con sus estadísticas desbalanceadas y habilidades aparentemente inútiles, los Caballeros Pesados son considerados una clase para cobardes y perezosos. Sin embargo, Elymas conoce la verdad. El mundo en el que vive es el mismo que el del juego que solía jugar... Y es el Caballero Pesado el que es la clase más poderosa de todas. Usando recuerdos de su vida pasada, Elymas ha decidido conquistar este mundo por completo.",poster:null,slug:"tsuihou-sareta-tensei-juukishi-wa-game-chishiki-de-musou-suru",startDate:"2026-07-03",createdAt:"2026-07-02 14:21:58.757961+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:60284,number:13,createdAt:"2026-09-24T17:16:20.66127+00:00"}},{id:3928,title:"Honzuki no Gekokujou: Shisho ni Naru Tame ni wa Shudan wo Erandeiraremasen - Ryoushu no Youjo",synopsis:"Adaptación de anime de la tercera parte de la novela ligera Honzuki no Gekokujou.",poster:null,slug:"honzuki-no-gekokujou-shisho-ni-naru-tame-ni-wa-shudan-wo-erandeiraremasen-ryoushu-no-youjo",startDate:"2026-04-04",createdAt:"2026-04-04 11:32:13.231925+00",category:{id:1,name:"TV Anime"},latestEpisode:{id:60293,number:23,createdAt:"2026-09-26T11:58:39.144042+00:00"}},{id:3968,title:"Re:Zero kara Hajimeru Isekai Seikatsu 4th Season",synopsis:"En la mortal batalla en la Ciudad de Agua de Priestella, Subaru y sus aliados apenas lograron salir victoriosos, pero su triunfo tuvo un alto costo. A través de la \"Autoridad de la Glotonería\", Rem fue puesta en an
